<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DreamSaver — Carta Natal Local & Perfil</title>
  <style>
    :root {
      --bg-main: #0c0e18;
      --bg-card: #15192b;
      --bg-soft: #1d223b;
      --text-main: #f3f4fa;
      --text-muted: #a6adc8;
      --accent: #9b87f5;
      --accent-2: #63e6be;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
    }

    .profile-container {
      max-width: 820px;
      margin: 28px auto;
      padding: 0 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      background: var(--bg-card);
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 18px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input, select {
      background: var(--bg-soft);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 0.95rem;
    }

    .btn-primary, .btn-secondary {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.92rem;
    }

    .btn-primary {
      background: var(--accent);
      color: #0b0d17;
      align-self: end;
    }

    .btn-secondary {
      background: var(--bg-soft);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    #astrology-results {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .natal-summary-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .natal-pill {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .natal-pill span {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .natal-pill strong {
      font-size: 1.05rem;
      color: var(--text-main);
    }

    .natal-chart-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 14px 0 18px;
    }

    #astrology-chart {
      max-width: 100%;
      height: auto;
      border-radius: 50%;
    }

    .natal-invite-box {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(155, 135, 245, 0.1);
      border: 1px solid rgba(155, 135, 245, 0.35);
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 12px;
    }

    .natal-invite-box p {
      margin: 0;
      font-size: 0.92rem;
      color: var(--text-main);
    }

    .natal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .muted {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="profile-container">
    <form id="natal-profile-form" class="form-grid">
      <label>
        Fecha de nacimiento
        <input type="date" id="natal-dob" value="1988-07-21" required />
      </label>
      <label>
        Hora de nacimiento
        <input type="time" id="natal-tob" value="16:00" required />
      </label>
      <label>
        Ciudad / Lugar
        <select id="natal-city">
          <option value="castro" selected>Castro, Chile</option>
          <option value="santiago">Santiago, Chile</option>
          <option value="ancud">Ancud, Chile</option>
          <option value="puerto_montt">Puerto Montt, Chile</option>
          <option value="buenos_aires">Buenos Aires, Argentina</option>
          <option value="madrid">Madrid, España</option>
          <option value="custom">Coordenadas manuales</option>
        </select>
      </label>
      <button type="submit" class="btn-primary">Calcular Carta Natal</button>
    </form>

    <div id="custom-coords-row" class="form-grid" style="display:none; margin-top:-6px;">
      <label>
        Latitud (°)
        <input type="number" step="0.0001" id="natal-lat" value="-42.4721" />
      </label>
      <label>
        Longitud (°)
        <input type="number" step="0.0001" id="natal-lon" value="-73.7642" />
      </label>
      <label>
        Zona horaria IANA
        <input type="text" id="natal-tz" value="America/Santiago" />
      </label>
    </div>

    <!-- Contenedor en pestaña de perfil: gráfico resumido + invitación a ver más -->
    <section id="astrology-results" aria-live="polite"></section>
  </main>

  <script>
    const ZODIAC_ORDER = [
      "Aries", "Tauro", "Géminis", "Cáncer", "Leo", "Virgo",
      "Libra", "Escorpio", "Sagitario", "Capricornio", "Acuario", "Piscis"
    ];

    const CITY_CATALOG = {
      castro: { name: "Castro, Chile", lat: -42.4721, lon: -73.7642, tz: "America/Santiago" },
      santiago: { name: "Santiago, Chile", lat: -33.4489, lon: -70.6693, tz: "America/Santiago" },
      ancud: { name: "Ancud, Chile", lat: -41.8697, lon: -73.8203, tz: "America/Santiago" },
      puerto_montt: { name: "Puerto Montt, Chile", lat: -41.4689, lon: -72.9411, tz: "America/Santiago" },
      buenos_aires: { name: "Buenos Aires, Argentina", lat: -34.6037, lon: -58.3816, tz: "America/Argentina/Buenos_Aires" },
      madrid: { name: "Madrid, España", lat: 40.4168, lon: -3.7038, tz: "Europe/Madrid" }
    };

    const deg2rad = (deg) => (deg * Math.PI) / 180;
    const rad2deg = (rad) => ((rad * 180) / Math.PI + 360) % 360;
    const norm360 = (deg) => ((deg % 360) + 360) % 360;

    function formatDegreeInSign(lonDeg) {
      const normalized = norm360(lonDeg);
      const signIndex = Math.floor(normalized / 30) % 12;
      const withinSign = normalized % 30;
      const deg = Math.floor(withinSign);
      const min = Math.floor((withinSign - deg) * 60);
      return {
        sign: ZODIAC_ORDER[signIndex],
        signIndex,
        degWithinSign: withinSign,
        label: `${ZODIAC_ORDER[signIndex]} ${deg}°${String(min).padStart(2, "0")}'`,
        lon: normalized
      };
    }

    // Convierte fecha/hora local a milisegundos UTC usando zona horaria IANA
    function localBirthToUtcMs(dobStr, tobStr = "12:00", timeZone = "America/Santiago", lonDeg = 0) {
      const [year, month, day] = dobStr.split("-").map(Number);
      const [hour = 12, minute = 0] = (tobStr || "12:00").split(":").map(Number);
      if (!year || !month || !day) return Date.now();

      try {
        // Estimación inicial UTC y ajuste iterativo por offset de zona horaria
        let guessUtcMs = Date.UTC(year, month - 1, day, hour, minute, 0);
        const formatter = new Intl.DateTimeFormat("en-CA", {
          timeZone,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });

        for (let i = 0; i < 3; i++) {
          const parts = formatter.formatToParts(new Date(guessUtcMs));
          const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
          const zonedAsUtc = Date.UTC(
            Number(map.year),
            Number(map.month) - 1,
            Number(map.day),
            Number(map.hour === "24" ? 0 : map.hour),
            Number(map.minute),
            Number(map.second || 0)
          );
          const targetAsUtc = Date.UTC(year, month - 1, day, hour, minute, 0);
          guessUtcMs += (targetAsUtc - zonedAsUtc);
        }
        return guessUtcMs;
      } catch {
        const offsetHours = Math.round(lonDeg / 15);
        return Date.UTC(year, month - 1, day, hour - offsetHours, minute, 0);
      }
    }

    // Cálculo astronómico local de longitudes eclípticas (J2000) sin llamadas externas
    function estimatePositionsAtMs(utcMs) {
      const jd = utcMs / 86400000 + 2440587.5;
      const d = jd - 2451545.0; // días desde J2000.0
      const t = d / 36525.0;

      // Sol
      const sunMeanAnomaly = norm360(357.5291092 + 0.98560028 * d);
      const sunMeanLon = norm360(280.46646 + 36000.76983 * t);
      const mRad = deg2rad(sunMeanAnomaly);
      const sunEqCenter =
        1.914602 * Math.sin(mRad) +
        0.019993 * Math.sin(2 * mRad) +
        0.000289 * Math.sin(3 * mRad);
      const sunLon = norm360(sunMeanLon + sunEqCenter);

      // Luna (incluye ecuación del centro, evicción y variación principales)
      const moonMeanLon = norm360(218.3164477 + 13.176396468 * d);
      const moonMeanAnomaly = norm360(134.9633964 + 13.06499295 * d);
      const moonElongation = norm360(297.8501921 + 12.19074912 * d);

      const lRad = deg2rad(moonMeanLon);
      const mmRad = deg2rad(moonMeanAnomaly);
      const dRad = deg2rad(moonElongation);

      const moonLon = norm360(
        moonMeanLon +
        6.288774 * Math.sin(mmRad) +
        1.274027 * Math.sin(2 * dRad - mmRad) +
        0.658314 * Math.sin(2 * dRad) +
        0.213618 * Math.sin(2 * mmRad) -
        0.185116 * Math.sin(mRad) -
        0.114332 * Math.sin(2 * lRad)
      );

      // Nodo Norte Lunar medio
      const northNodeLon = norm360(125.04452 - 0.0529539 * d);

      // Planetas principales (aproximación orbital eclíptica)
      const bodies = {
        Sun: sunLon,
        Moon: moonLon,
        NorthNode: northNodeLon,
        SouthNode: norm360(northNodeLon + 180),
        Mercury: norm360(252.25084 + 4.09233445 * d + 20.5 * Math.sin(deg2rad(174.79 + 4.09233445 * d))),
        Venus: norm360(181.97973 + 1.60213034 * d + 0.77 * Math.sin(deg2rad(50.42 + 1.60213034 * d))),
        Mars: norm360(355.433 + 0.52402068 * d + 10.69 * Math.sin(deg2rad(19.37 + 0.52402068 * d))),
        Jupiter: norm360(34.35151 + 0.08308529 * d + 5.55 * Math.sin(deg2rad(20.02 + 0.08308529 * d))),
        Saturn: norm360(50.07744 + 0.03344414 * d + 6.35 * Math.sin(deg2rad(317.02 + 0.03344414 * d))),
        Uranus: norm360(314.055 + 0.01172834 * d + 5.3 * Math.sin(deg2rad(142.24 + 0.01172834 * d))),
        Neptune: norm360(304.34866 + 0.00598103 * d + 1.0 * Math.sin(deg2rad(256.22 + 0.00598103 * d)))
      };

      return bodies;
    }

    // Cálculo del Ascendente y cúspides iguales/cuadrante simplificado 100% local
    function computeAscendantDeg(utcMs, latDeg, lonDeg) {
      const jd = utcMs / 86400000 + 2440587.5;
      const t = (jd - 2451545.0) / 36525.0;

      // Tiempo sidéreo en Greenwich (GMST) en grados
      let gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * t * t;
      const lstRad = deg2rad(norm360(gmst + lonDeg));
      const epsRad = deg2rad(23.4392911 - 0.0130042 * t);
      const latRad = deg2rad(latDeg);

      // Fórmula estándar del Ascendente eclíptico
      const y = -Math.cos(lstRad);
      const x = Math.sin(lstRad) * Math.cos(epsRad) + Math.tan(latRad) * Math.sin(epsRad);
      return rad2deg(Math.atan2(y, x));
    }

    // Motor principal de carta natal local sin APIs
    function computeLocalNatalChart({ dob, tob, lat, lon, tz, placeName }) {
      const utcMs = localBirthToUtcMs(dob, tob, tz, lon);
      const positions = estimatePositionsAtMs(utcMs);
      const ascLon = computeAscendantDeg(utcMs, lat, lon);

      const sun = formatDegreeInSign(positions.Sun);
      const moon = formatDegreeInSign(positions.Moon);
      const asc = formatDegreeInSign(ascLon);

      const planets = Object.entries(positions).map(([name, lonDeg]) => {
        const info = formatDegreeInSign(lonDeg);
        const house = Math.floor(norm360(lonDeg - asc.lon) / 30) + 1;
        return {
          name,
          lon: info.lon,
          sign: info.sign,
          degWithinSign: info.degWithinSign,
          label: info.label,
          house
        };
      });

      const houses = Array.from({ length: 12 }, (_, idx) => {
        const cuspLon = norm360(asc.lon + idx * 30);
        const info = formatDegreeInSign(cuspLon);
        return {
          house: idx + 1,
          lon: info.lon,
          sign: info.sign,
          label: info.label
        };
      });

      return {
        meta: { dob, tob, lat, lon, tz, placeName, utcMs },
        sun,
        moon,
        asc,
        planets,
        houses
      };
    }

    // Gráfico circular resumido en canvas (#astrology-chart)
    function drawNatalSummaryChart(canvas, chart) {
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const outerR = Math.min(w, h) / 2 - 12;
      const innerR = outerR * 0.68;

      ctx.clearRect(0, 0, w, h);

      // Rueda de 12 signos
      for (let i = 0; i < 12; i++) {
        const startAngle = deg2rad(i * 30 - 90);
        const endAngle = deg2rad((i + 1) * 30 - 90);

        ctx.beginPath();
        ctx.arc(cx, cy, outerR, startAngle, endAngle);
        ctx.arc(cx, cy, innerR, endAngle, startAngle, true);
        ctx.closePath();
        ctx.fillStyle = i % 2 === 0 ? "#1b2038" : "#222846";
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.12)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Centro
      ctx.beginPath();
      ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
      ctx.fillStyle = "#121524";
      ctx.fill();
      ctx.strokeStyle = "rgba(155, 135, 245, 0.35)";
      ctx.stroke();

      // Marcadores clave: Sol, Luna, Ascendente
      const markers = [
        { lon: chart.sun.lon, color: "#ffd166", label: "☉" },
        { lon: chart.moon.lon, color: "#72efdd", label: "☽" },
        { lon: chart.asc.lon, color: "#9b87f5", label: "AC" }
      ];

      markers.forEach((m) => {
        const angle = deg2rad(m.lon - 90);
        const px = cx + Math.cos(angle) * ((outerR + innerR) / 2);
        const py = cy + Math.sin(angle) * ((outerR + innerR) / 2);

        ctx.beginPath();
        ctx.arc(px, py, 10, 0, Math.PI * 2);
        ctx.fillStyle = m.color;
        ctx.fill();

        ctx.fillStyle = "#0b0d17";
        ctx.font = "bold 10px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(m.label, px, py);
      });

      ctx.fillStyle = "#f3f4fa";
      ctx.font = "600 13px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Carta Natal", cx, cy - 6);
      ctx.fillStyle = "#a6adc8";
      ctx.font = "11px system-ui, sans-serif";
      ctx.fillText("Cálculo Local", cx, cy + 12);
    }

    // Render en pestaña de perfil: resumen + gráfico + invitación a ver más
    function renderProfileNatalCard(chart) {
      const container = document.getElementById("astrology-results");
      container.innerHTML = `
        <div class="natal-summary-strip">
          <div class="natal-pill">
            <span>Sol</span>
            <strong>${chart.sun.label}</strong>
          </div>
          <div class="natal-pill">
            <span>Luna</span>
            <strong>${chart.moon.label}</strong>
          </div>
          <div class="natal-pill">
            <span>Ascendente</span>
            <strong>${chart.asc.label}</strong>
          </div>
        </div>

        <div class="natal-chart-wrap">
          <canvas id="astrology-chart" width="240" height="240"></canvas>
          <div class="muted">
            ${chart.meta.placeName} · ${chart.meta.dob} ${chart.meta.tob} (${chart.meta.tz})
          </div>
        </div>

        <div class="natal-invite-box">
          <p>
            <strong>Vista resumida en tu perfil.</strong> Explora la distribución completa de planetas, casas y tu lectura en Diseño Humano.
          </p>
          <button type="button" id="btn-see-more-natal" class="btn-secondary">
            Ver detalle y Diseño Humano →
          </button>
        </div>

        <div id="natal-expanded-details" style="display:none; margin-top:16px;">
          <p class="muted"><strong>Posiciones planetarias y casas:</strong></p>
          <ul id="natal-planets-list" class="muted"></ul>
          <div class="natal-actions">
            <button type="button" id="btn-print-natal" class="btn-secondary">Imprimir / Guardar PDF</button>
          </div>
        </div>
      `;

      const canvas = document.getElementById("astrology-chart");
      drawNatalSummaryChart(canvas, chart);

      const listEl = document.getElementById("natal-planets-list");
      listEl.innerHTML = chart.planets
        .map(p => `<li><strong>${p.name}:</strong> ${p.label} (Casa ${p.house})</li>`)
        .join("");

      document.getElementById("btn-see-more-natal").addEventListener("click", () => {
        const details = document.getElementById("natal-expanded-details");
        const isOpen = details.style.display === "block";
        details.style.display = isOpen ? "none" : "block";
      });

      document.getElementById("btn-print-natal").addEventListener("click", () => {
        window.print();
      });
    }

    function getSelectedLocation() {
      const cityKey = document.getElementById("natal-city").value;
      if (cityKey === "custom") {
        return {
          placeName: "Coordenadas personalizadas",
          lat: Number(document.getElementById("natal-lat").value) || 0,
          lon: Number(document.getElementById("natal-lon").value) || 0,
          tz: document.getElementById("natal-tz").value.trim() || "UTC"
        };
      }
      return CITY_CATALOG[cityKey] || CITY_CATALOG.castro;
    }

    document.getElementById("natal-city").addEventListener("change", (e) => {
      document.getElementById("custom-coords-row").style.display =
        e.target.value === "custom" ? "grid" : "none";
    });

    document.getElementById("natal-profile-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const dob = document.getElementById("natal-dob").value;
      const tob = document.getElementById("natal-tob").value;
      const loc = getSelectedLocation();
      const chart = computeLocalNatalChart({ dob, tob, ...loc });
      renderProfileNatalCard(chart);
    });

    // Cálculo inicial automático al cargar el perfil
    window.addEventListener("DOMContentLoaded", () => {
      const dob = document.getElementById("natal-dob").value;
      const tob = document.getElementById("natal-tob").value;
      const chart = computeLocalNatalChart({ dob, tob, ...CITY_CATALOG.castro });
      renderProfileNatalCard(chart);
    });
  </script>
</body>
</html>
